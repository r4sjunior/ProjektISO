<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2c2e">
<title>PS1 Web</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- Biblioteca -->
<main id="library" class="library">
  <header class="top">
    <h1>PS1 Web</h1>
    <p>Escolha um jogo e jogue direto no navegador, no computador ou no celular.</p>
  </header>

  <section id="grid" class="grid" aria-label="Jogos disponíveis"></section>
  <p id="msg" class="msg" role="status"></p>

  <section class="local">
    <h2>Tem outro jogo?</h2>
    <p>Abra um arquivo do seu computador. Ele fica só no seu navegador.</p>
    <input id="localRom" type="file" hidden accept=".cue,.bin,.iso,.img,.chd,.pbp,.zip,.7z,.m3u">
    <button id="localBtn" class="btn ghost" type="button">Abrir arquivo local</button>
  </section>

  <footer class="legal">
    Emulação por <a href="https://emulatorjs.org" target="_blank" rel="noopener">EmulatorJS</a>.
    Use apenas jogos e BIOS que você possui legalmente. · <a href="admin.html">Admin</a>
  </footer>
</main>

<!-- Player -->
<section id="player" class="player" hidden>
  <button id="back" class="back" type="button" aria-label="Voltar para a biblioteca">‹ Jogos</button>
  <div id="game"></div>
</section>

<div id="rotate" class="rotate" hidden>Gire o celular para jogar na horizontal</div>

<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
